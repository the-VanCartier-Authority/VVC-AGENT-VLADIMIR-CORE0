name: CORE0 validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/core0-reproducibility-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modules
        run: |
          python3 -m py_compile event_bus.py state.py main.py core/__init__.py core/state.py core/event_bus.py
      - name: Test agent
        run: python3 test_agent.py
      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD
